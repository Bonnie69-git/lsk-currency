<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LSK Currency</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card2: #111113;
  --t: #00e5cc;
  --t2: #00c4ae;
  --t3: #008f7e;
  --t-contrast: #000000;
  --t-emphasis: #00e5cc;
  --tg: #00e5cc18;
  --result-bg: #1c2333;
  --text: #ffffff;
  --sub: #8e8e93;
  --sub2: #aeaeb2;
  --border: #2a2a2c;
  --up: #34c759;
  --down: #ff453a;
  --r: 16px;
  --rl: 22px;
  --rf: 999px;
}
html { background:#0c0b11; }
body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; overflow-x:hidden; padding-bottom:calc(86px + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased; max-width:480px; margin:0 auto; box-shadow:0 0 60px rgba(0,0,0,0.6); }

/* Светлая тема: эти элементы лежат прямо на фоне страницы (не внутри
   тёмных карточек), поэтому им нужен свой тёмный цвет текста, а не
   унаследованный var(--text)/var(--sub), которые остаются светлыми для
   текста ВНУТРИ чёрных карточек */
body.light-theme .brand-text-main,
body.light-theme .brand-text-sub,
body.light-theme .update-counter,
body.light-theme .conv-rate-line,
body.light-theme .group-title,
body.light-theme .ptr-indicator,
body.light-theme .empty-state { color:#0a0a0a; }

/* HEADER */
.header { padding:11px 16px; display:flex; align-items:center; justify-content:space-between; background:var(--bg); background:color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); position:sticky; top:0; z-index:100; border-bottom:1px solid var(--border); }
.brand { display:flex; align-items:center; gap:12px; }
.brand-icon img { width:100%; height:100%; display:block; }
.brand-icon { width:34px; height:34px; border-radius:50%; overflow:hidden; background:transparent; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:var(--t-contrast); flex-shrink:0; }
.brand-text-main { font-size:15px; font-weight:600; color:var(--text); letter-spacing:-0.2px; }
.brand-text-sub { font-size:9px; color:var(--sub); font-weight:500; margin-top:1px; letter-spacing:0.8px; }
.header-right { display:flex; align-items:center; gap:8px; }
.hbtn { height:30px; border-radius:var(--rf); border:none; cursor:pointer; font-family:'Inter',sans-serif; font-weight:500; font-size:11px; display:flex; align-items:center; padding:0 12px; transition:opacity 0.15s; }
.hbtn:active { opacity:0.7; }
.lang-btn { background:var(--card); color:var(--sub2); padding:0 3px; gap:2px; border:1px solid var(--border); }
.lang-btn span { padding:4px 8px; border-radius:999px; font-weight:600; font-size:11px; line-height:1; }
.lang-btn span.on { background:var(--t); color:var(--t-contrast); }
.live-dot { width:6px; height:6px; border-radius:50%; background:var(--up); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* SECTIONS */
.section { display:none; padding:10px 14px 14px; }
.section.active { display:block; animation:secIn 0.22s ease-out; }
@keyframes secIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.page-title { font-size:26px; font-weight:700; letter-spacing:-0.6px; color:var(--text); margin:4px 4px 12px; }
body.light-theme .page-title { color:#0a0a0a; }

/* BOTTOM TAB BAR */
.tabbar { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px; display:flex; gap:2px; background:var(--card); background:color-mix(in srgb, var(--card) 86%, transparent); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); border-top:1px solid var(--border); padding:6px 8px calc(6px + env(safe-area-inset-bottom)); z-index:120; }
.tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0 4px; background:none; border:none; color:var(--sub); font-family:'Inter',sans-serif; font-size:10px; font-weight:500; cursor:pointer; border-radius:12px; transition:color 0.15s, transform 0.1s; }
.tab-btn svg { width:23px; height:23px; display:block; }
.tab-btn:active { transform:scale(0.92); }
.tab-btn.active { color:var(--t-emphasis); font-weight:600; }
.tab-ico { position:relative; padding:3px 14px; border-radius:999px; transition:background 0.2s; }
.tab-btn.active .tab-ico { background:var(--tg); }

/* QUICK PAIRS */
.quick-pairs { display:flex; gap:8px; overflow-x:auto; margin:0 -14px 12px; padding:2px 14px; scrollbar-width:none; }
.quick-pairs::-webkit-scrollbar { display:none; }
.qp { flex-shrink:0; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:9px 13px; cursor:pointer; transition:border-color 0.15s, transform 0.1s; }
.qp:active { transform:scale(0.96); }
.qp.active { border-color:var(--t); }
.qp-pair { font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; }
.qp-rate { font-size:11px; color:var(--sub); margin-top:3px; white-space:nowrap; }

/* CARD */
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--rl); padding:14px 14px 14px; margin-bottom:8px; }
.card-label { font-size:10px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:1.3px; margin-bottom:8px; }

/* CONVERTER */
.num-input { flex:1; background:#000; border:none; border-radius:12px; padding:14px 16px; font-size:22px; font-weight:500; color:var(--text); outline:none; font-family:'Inter',sans-serif; min-width:0; }
.cur-select { background:#000; border:none; border-radius:12px; padding:14px 14px; font-size:14px; font-weight:600; color:var(--text); outline:none; cursor:pointer; font-family:'Inter',sans-serif; width:100%; -webkit-appearance:none; display:block; }

/* UNIFIED CONVERTER CARD */
.converter-card { background:var(--card); background:linear-gradient(155deg, color-mix(in srgb, var(--t) 16%, var(--card)) 0%, var(--card) 58%); border:1px solid var(--border); border-color:color-mix(in srgb, var(--t) 28%, var(--border)); border-radius:24px; padding:4px; margin-bottom:10px; position:relative; box-shadow:0 14px 34px -18px color-mix(in srgb, var(--t) 55%, transparent); }
.conv-row { padding:16px 14px 18px; display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
.conv-amount { background:transparent; border:none; outline:none; font-size:32px; font-weight:600; letter-spacing:-0.4px; color:var(--text); font-family:'Inter',sans-serif; width:100%; padding:0; min-width:0; }
.conv-result-num { font-size:32px; font-weight:600; letter-spacing:-0.4px; color:var(--t-emphasis); line-height:1; word-break:break-all; }
.conv-divider { height:1px; background:var(--border); margin:0 14px; }
.cur-pill-wrap { position:relative; flex-shrink:0; }
.cur-pill { background:var(--card2); border:none; border-radius:var(--rf); padding:10px 30px 10px 16px; font-size:14px; font-weight:600; color:var(--text); font-family:'Inter',sans-serif; outline:none; cursor:pointer; -webkit-appearance:none; appearance:none; }
.cur-pill-chevron { position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:10px; color:var(--sub); pointer-events:none; }
.swap-btn-float { position:absolute; left:50%; margin-left:-16px; right:auto; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; background:var(--t); display:flex; align-items:center; justify-content:center; cursor:pointer; border:3px solid var(--card); font-size:13px; color:var(--t-contrast); transition:transform 0.2s; }
.swap-btn-float:active { transform:translateY(-50%) rotate(180deg); }
.swap-btn-float { box-shadow:0 4px 14px -4px color-mix(in srgb, var(--t) 70%, transparent); }
body.light-theme .swap-btn-float { background:#ffffff; color:#000000; }
.conv-rate-line { font-size:11px; color:var(--sub); text-align:center; margin-bottom:10px; }

/* ACTIONS */
.conv-actions { display:flex; align-items:stretch; gap:10px; margin-bottom:8px; }
.copy-btn { background:var(--t); border:none; border-radius:var(--rf); padding:14px 0; font-size:14px; font-weight:600; color:var(--t-contrast); cursor:pointer; font-family:'Inter',sans-serif; flex:1; letter-spacing:0.1px; transition:opacity 0.15s, transform 0.1s; }
.copy-btn:active { opacity:0.85; transform:scale(0.98); }
.fav-icon-btn { width:48px; flex-shrink:0; background:var(--card); border:1px solid var(--border); border-radius:50%; font-size:16px; color:var(--sub2); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:opacity 0.15s, transform 0.1s; }
.fav-icon-btn:active { opacity:0.7; transform:scale(0.94); }

/* MULTI */
.multi-card { background:var(--card); border:1px solid var(--border); border-radius:var(--rl); padding:12px 14px; margin-bottom:8px; }
.multi-label { font-size:11px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:10px; }
.multi-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; cursor:pointer; border-bottom:1px solid var(--border); }
.multi-item:last-child { border-bottom:none; }
.multi-name { font-size:13px; color:var(--sub2); }
.multi-val { font-size:14px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; }

/* RATES */
.group-title { font-size:11px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:1.2px; margin:16px 0 8px; padding:0 4px; }
.rate-item { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:12px 15px; display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; cursor:pointer; transition:background 0.12s, transform 0.1s; }
.rate-item:active { transform:scale(0.98); }
.rate-item:active { background:var(--card2); }
.rate-left { display:flex; align-items:center; gap:13px; }
.rate-flag { font-size:22px; width:28px; text-align:center; line-height:1; }
.coin-badge { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8.5px; font-weight:800; letter-spacing:-0.2px; flex-shrink:0; }
.rate-name { font-size:13px; font-weight:500; color:var(--text); }
.rate-code { font-size:11px; color:var(--sub); margin-top:2px; }
.rate-right { text-align:right; }
.rate-val { font-size:14px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; }
.rate-chg, .rate-change { font-size:11px; margin-top:2px; font-weight:600; }
.rate-chg.up, .rate-change.up { color:var(--up); }
.rate-chg.down, .rate-change.down { color:var(--down); }
.rate-chg.flat, .rate-change.flat { color:var(--sub); }
.coin-img { width:38px; height:38px; border-radius:50%; flex-shrink:0; display:block; }

/* SEGMENTED */
.seg { display:flex; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:3px; gap:3px; margin-bottom:4px; }
.seg-btn { flex:1; background:none; border:none; border-radius:11px; padding:9px 0; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--sub2); cursor:pointer; transition:background 0.15s, color 0.15s; }
.seg-btn.active { background:var(--t); color:var(--t-contrast); }
#markets-head + .section { padding-top:8px; }

/* ICONS: флаги и металлы в круглых значках */
.flag-ico { width:38px; height:38px; border-radius:50%; flex-shrink:0; object-fit:cover; display:block; box-shadow:0 0 0 1px var(--border); }
.flag-fb { width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px; background:var(--card2); }
.metal-ico { width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; letter-spacing:-0.3px; color:#1d1d1f; box-shadow:inset 0 1px 1px rgba(255,255,255,0.55), inset 0 -2px 3px rgba(0,0,0,0.25); }
.metal-item { cursor:pointer; }

/* MARKET LIST — одна карточка с разделителями, как в биржевых приложениях */
.list { background:var(--card); border:1px solid var(--border); border-radius:20px; overflow:hidden; }
.list .rate-item, .list .metal-item { background:transparent; border:none; border-radius:0; margin:0; padding:13px 15px; border-bottom:1px solid var(--border); }
.list .rate-item:last-child, .list .metal-item:last-child { border-bottom:none; }
.list .rate-item:active { background:var(--card2); transform:none; }
.rate-change { display:inline-block; min-width:62px; text-align:center; padding:3px 7px; border-radius:7px; font-size:11px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
.rate-change:empty { display:none; }
.rate-change.up { background:color-mix(in srgb, var(--up) 16%, transparent); }
.rate-change.down { background:color-mix(in srgb, var(--down) 16%, transparent); }
.rate-change.flat { background:var(--card2); }

/* SEARCH */
.search-wrap { position:relative; margin-bottom:12px; }
.search-input { width:100%; background:var(--card); border:1px solid var(--border); border-radius:var(--rf); padding:12px 14px 12px 40px; font-size:14px; color:var(--text); outline:none; font-family:'Inter',sans-serif; }
.search-input::placeholder { color:var(--sub); }
.search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--sub); pointer-events:none; }

/* METALS */
.metal-item { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:13px 15px; display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.metal-val { font-size:15px; font-weight:600; color:var(--text); text-align:right; }
.metal-sub { font-size:11px; color:var(--sub); margin-top:2px; text-align:right; }


/* CALCULATOR */

/* SAVED */
.hist-item { background:var(--card); border-radius:var(--r); padding:13px 15px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
.hist-from { font-size:13px; font-weight:600; color:var(--text); }
.hist-time { font-size:11px; color:var(--sub); margin-top:2px; }
.hist-res { font-size:14px; font-weight:600; color:var(--t-emphasis); }
.fav-item { background:var(--card); border-radius:var(--r); padding:13px 15px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.fav-item:active { background:var(--card2); }
.fav-pair { font-size:14px; font-weight:600; color:var(--text); }
.fav-rate { font-size:14px; font-weight:600; color:var(--t-emphasis); }
.fav-del { color:var(--sub); font-size:16px; cursor:pointer; padding:0 4px; }


/* CHART SHEET — как карточка инструмента на бирже */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200; align-items:flex-end; justify-content:center; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
.modal-overlay.open { display:flex; }
.modal { background:var(--bg); border-radius:24px 24px 0 0; padding:8px 16px calc(18px + env(safe-area-inset-bottom)); width:100%; max-width:480px; border-top:1px solid var(--border); animation:sheetUp 0.25s cubic-bezier(0.2,0.8,0.2,1); }
@keyframes sheetUp { from { transform:translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
.sheet-grip { width:38px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 12px; }
.ch-head { display:flex; align-items:center; gap:12px; }
.ch-names { flex:1; min-width:0; }
.ch-name { font-size:16px; font-weight:700; color:var(--text); }
.ch-pair { font-size:12px; color:var(--sub); margin-top:2px; font-weight:500; }
.modal-close { width:32px; height:32px; border-radius:50%; background:var(--card); border:1px solid var(--border); cursor:pointer; font-size:13px; color:var(--sub2); display:flex; align-items:center; justify-content:center; }
.ch-price { font-size:32px; font-weight:700; letter-spacing:-0.8px; color:var(--text); margin-top:16px; font-variant-numeric:tabular-nums; line-height:1.1; }
.ch-sub { display:flex; align-items:center; gap:8px; margin-top:6px; min-height:22px; }
.ch-date { font-size:12px; color:var(--sub); }
.chart-wrap { position:relative; height:220px; margin:14px -6px 8px; }
.period-tabs { display:flex; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:3px; margin-bottom:12px; }
.period-btn { flex:1; padding:8px 2px; text-align:center; font-size:12px; font-weight:600; color:var(--sub2); cursor:pointer; border-radius:9px; border:none; background:none; font-family:'Inter',sans-serif; transition:all 0.15s; }
.period-btn.active { color:var(--text); background:var(--card2); box-shadow:0 0 0 1px var(--border); }
.period-btn[hidden] { display:none; }
.chart-stats { display:flex; gap:8px; margin-bottom:12px; }
.stat-box { flex:1; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:10px 12px; }
.stat-label { font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
.stat-val { font-size:14px; font-weight:700; color:var(--text); margin-top:4px; font-variant-numeric:tabular-nums; }

/* ALERTS */
.ch-bell { margin-right:-4px; font-size:14px; }
.ch-bell[hidden] { display:none; }
.al-bell { width:38px; height:38px; border-radius:50%; background:var(--tg); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.al-swap { width:38px; height:38px; flex-shrink:0; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--t-emphasis); font-size:16px; cursor:pointer; }
.al-now { font-size:12px; color:var(--sub); margin:10px 4px 0; }
.al-now b { color:var(--text); font-weight:600; }
.al-target { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:14px 16px; margin-top:10px; }
.al-input-row { display:flex; align-items:baseline; gap:8px; }
.al-input-row .conv-amount { flex:1; min-width:0; }
.al-unit { font-size:18px; font-weight:600; color:var(--sub2); }
.al-dir { font-size:12px; font-weight:600; margin-top:4px; min-height:16px; }
.al-dir.up { color:var(--up); } .al-dir.down { color:var(--down); }
.al-chips { display:flex; gap:6px; margin:10px 0 4px; }
.al-chip { flex:1; padding:8px 0; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--sub2); font-family:'Inter',sans-serif; font-size:12px; font-weight:600; cursor:pointer; font-variant-numeric:tabular-nums; }
.al-chip:active { background:var(--card2); }
.al-hint { font-size:11px; color:var(--sub); text-align:center; margin-top:10px; line-height:1.45; min-height:16px; }
.al-hint.err { color:var(--down); }
.al-hint.ok { color:var(--up); }
.al-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 15px; border-bottom:1px solid var(--border); }
.al-item:last-child { border-bottom:none; }
.al-pair { font-size:14px; font-weight:600; color:var(--text); }
.al-cond { font-size:11px; color:var(--sub); margin-top:2px; }
.al-cond .up { color:var(--up); } .al-cond .down { color:var(--down); }
.al-add { display:block; width:100%; margin:8px 0 0; background:var(--card); color:var(--t-emphasis); border:1px dashed var(--border); border-radius:var(--rf); padding:12px 0; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; }
.al-empty { font-size:12px; color:var(--sub); padding:14px 15px; line-height:1.45; }

/* NEWS */
.news-item { display:flex; gap:12px; padding:13px 15px; border-bottom:1px solid var(--border); cursor:pointer; text-decoration:none; }
.news-item:last-child { border-bottom:none; }
.news-item:active { background:var(--card2); }
.news-body { flex:1; min-width:0; }
.news-title { font-size:14px; font-weight:600; color:var(--text); line-height:1.35; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.news-meta { font-size:11px; color:var(--sub); margin-top:5px; display:flex; gap:6px; align-items:center; }
.news-src { color:var(--t-emphasis); font-weight:600; }
.news-img { width:64px; height:64px; border-radius:12px; object-fit:cover; flex-shrink:0; background:var(--card2); }

/* LOADING */
.loading { text-align:center; padding:50px 20px; color:var(--sub); font-size:13px; }
.spinner { width:28px; height:28px; border:2px solid var(--border); border-top-color:var(--t-emphasis); border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto 14px; }
@keyframes spin { to { transform:rotate(360deg); } }
.footer-note, .footer { text-align:center; font-size:11px; color:var(--sub); margin-top:16px; }
body.light-theme .footer { color:#555; }

/* TRANSFERS */
.tr-form { display:flex; flex-direction:column; gap:8px; }
.tr-row { display:flex; gap:8px; align-items:center; }
.tr-row .cur-select { flex:1; padding:12px; }
.tr-arrow { color:var(--sub); font-size:14px; flex-shrink:0; }

.empty-state { text-align:center; padding:30px 20px; color:var(--sub); font-size:13px; }

.ptr-indicator.visible { display:block; }


/* COUNTER */

// в events). sendBeacon не блокирует интерфейс и доходит, даже если
// человек сразу ушёл по ссылке.
const TRACK_API = 'https://daicafgagkvinbtqifbc.supabase.co/functions/v1/track';
function track(e, from, to) {
  try {
    const body = JSON.stringify({e, uid: TG?.initDataUnsafe?.user?.id || 0, from, to});
    if (!(navigator.sendBeacon && navigator.sendBeacon(TRACK_API, body)))
      fetch(TRACK_API, {method: 'POST', body, keepalive: true}).catch(() => {});
  } catch {}
}
track('app_open');

const SIGNS = {EUR:"€",USD:"$",UAH:"₴",GBP:"£",PLN:"zł",CHF:"₣",RUB:"₽",GEL:"₾",TRY:"₺",KZT:"₸",JPY:"¥",CNY:"¥",ILS:"₪",INR:"₹",AZN:"₼",AMD:"֏",BTC:"₿"};
const sign = c => SIGNS[c] || c;
function fmtPairRate(f, t, rate, invertBelow = 0.1) {
  if (!rate || !isFinite(rate)) return '—';
  if (rate < invertBelow) { [f, t] = [t, f]; rate = 1 / rate; }
  return `1 ${sign(f)} = ${fmt(rate)} ${sign(t)}`;
}

  const num = n >= 100 ? n.toLocaleString(loc, {maximumFractionDigits:0})
                       : n.toLocaleString(loc, {maximumFractionDigits:2});
  return `${num} ${sign(cur)}`;
}

function fmt(n) {
  if (!n||isNaN(n)) return "—";
  const loc = lang === 'ru' ? 'ru' : 'en-US';
  if (n>=1e9) return (n/1e9).toFixed(3)+"B";
  if (n>=1e6) return (n/1e6).toFixed(3)+"M";
  if (n>=1000) return n.toLocaleString(loc,{maximumFractionDigits:0});
  if (n>=1) return n.toLocaleString(loc,{minimumFractionDigits:2,maximumFractionDigits:2});
  if (n>=0.01) return n.toLocaleString(loc,{minimumFractionDigits:4,maximumFractionDigits:4});
  return n.toLocaleString(loc,{minimumFractionDigits:8,maximumFractionDigits:8});
}

// Дневные снимки курсов (fawazahmed0/currency-api) — для настоящих графиков
// фиата, изменения за сутки и цен металлов. Раньше график фиата рисовался
// случайными числами, а металлы брались из несуществующего эндпоинта.
const snapCache = {};
const isoDate = d => d.toISOString().slice(0,10);
async function fetchSnapshot(tag) {
  if (snapCache[tag]) return snapCache[tag];
  const p = (async () => {
    const urls = [
      `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${tag}/v1/currencies/usd.min.json`,
      `https://${tag}.currency-api.pages.dev/v1/currencies/usd.min.json`,
    ];
    for (const u of urls) {
      try {
        const r = await fetch(u, {signal: AbortSignal.timeout(8000)});
        if (r.ok) { const d = await r.json(); if (d.usd) return d; }
      } catch {}
    }
    return null;
  })();
  snapCache[tag] = p;
  const res = await p;
  if (!res) delete snapCache[tag];
  return res;
}

async function loadFiat() {
  const sources = [

      if (d[key] && Object.keys(d[key]).length) {

// Изменение за сутки: сравниваем два дневных снимка одного источника
async function loadDailyChanges() {
  const today = await fetchSnapshot('latest');
  if (!today) return;
  const d = new Date(today.date + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - 1);
  const prev = await fetchSnapshot(isoDate(d));
  if (!prev) return;
  ratesYesterday = {};
  for (const k in today.usd) {
    const a = today.usd[k], b = prev.usd[k];
    if (a && b) ratesYesterday[k.toUpperCase()] = (a - b) / b; // относит. изменение «валюта за 1 USD»
  }
  renderFiat();
}

// История крипты: сначала Binance (без жёстких лимитов, CORS открыт), потом
// CoinGecko. Раньше был только CoinGecko — на бесплатном тарифе он часто
// отвечает «слишком много запросов», и у SOL/ETH графики были пустые.
const BINANCE_HOSTS = ['https://data-api.binance.vision', 'https://api.binance.com'];
// USDT меряем через USDC/USDT (перевёрнутый), остальные — к USDT
const BINANCE_SYM = c => c === 'USDT' ? 'USDCUSDT' : c + 'USDT';
const KLINES = {'1':['15m',96], '7':['1h',168], '30':['4h',180], '90':['1d',90], '365':['1d',365]};
const chartCache = {};
async function cryptoHistory(code, days) {
  const key = code + ':' + days, hit = chartCache[key];
  if (hit && Date.now() - hit.t < 5 * 60000) return hit.v;
  let pts = [];
  const sym = BINANCE_SYM(code), [iv, lim] = KLINES[days] || KLINES['30'];
  if (sym) for (const host of BINANCE_HOSTS) {
    try {
      const r = await fetch(`${host}/api/v3/klines?symbol=${sym}&interval=${iv}&limit=${lim}`, {signal: AbortSignal.timeout(8000)});
      if (!r.ok) continue;
      const d = await r.json();
      if (Array.isArray(d) && d.length > 1) { pts = d.map(k => [k[6] > Date.now() ? Date.now() : k[6], code === 'USDT' ? 1 / parseFloat(k[4]) : parseFloat(k[4])]); break; }
    } catch {}
  }
  if (pts.length < 2) {
    try {
      const r = await fetch(`https://api.coingecko.com/api/v3/coins/${CRYPTO_IDS[code]}/market_chart?vs_currency=usd&days=${days}`, {signal: AbortSignal.timeout(10000)});
      const d = await r.json();
      if (Array.isArray(d.prices)) pts = d.prices;
    } catch {}
  }
  if (pts.length > 1) chartCache[key] = {t: Date.now(), v: pts};
  return pts;
}
// Цены и изменение за 24ч с Binance — для монет, которых не дал CoinGecko
async function fillFromBinance() {
  const need = CRYPTOS.filter(c => !cryptoPrices[c.code] && BINANCE_SYM(c.code));
  if (!need.length) return;
  const syms = encodeURIComponent(JSON.stringify(need.map(c => BINANCE_SYM(c.code))));
  for (const host of BINANCE_HOSTS) {
    try {
      const r = await fetch(`${host}/api/v3/ticker/24hr?symbols=${syms}`, {signal: AbortSignal.timeout(8000)});
      if (!r.ok) continue;
      const d = await r.json();
      if (!Array.isArray(d)) continue;
      const by = Object.fromEntries(d.map(x => [x.symbol, x]));
      need.forEach(c => { const x = by[BINANCE_SYM(c.code)]; if (x && +x.lastPrice) { const usdt = c.code === 'USDT'; cryptoPrices[c.code] = usdt ? 1 / +x.lastPrice : +x.lastPrice; cryptoChanges[c.code] = (usdt ? -1 : 1) * (+x.priceChangePercent || 0); } });
      return;
    } catch {}
  }
}
async function loadCrypto() {
  try {
    const ids = CRYPTOS.map(c=>c.id).join(',');
    const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
    const d = await r.json();
    CRYPTOS.forEach(c => {
      // Не затираем цену нулём, если в этот раз CoinGecko её не дал
      if (d[c.id]?.usd) { cryptoPrices[c.code] = d[c.id].usd; cryptoChanges[c.code] = d[c.id]?.usd_24h_change||0; }
    });
  } catch {}
  await fillFromBinance();
  if (CRYPTOS.some(c => !cryptoPrices[c.code])) {
    for (const c of CRYPTOS.filter(c => !cryptoPrices[c.code])) {
      try {
        const r = await fetch(`https://api.coinbase.com/v2/prices/${c.code}-USD/spot`);
        const d = await r.json();
        cryptoPrices[c.code] = parseFloat(d.data?.amount||0);
      } catch {}
    }
  }
  // Стейблкоины без цены (все источники недоступны) — считаем 1 $
  for (const c of ['USDT','USDC']) if (!cryptoPrices[c]) cryptoPrices[c] = 1;
  renderCrypto(); conv();
  lastUpdateTime = Date.now();
}

// Показываем курс в ту сторону, где число не мелкое: «1 $ = 45.39 ₴»,

  const text = r ? fmtPairRate('USD', code, r, 1) : '—';

  let pct = null;
  if (chg !== undefined) pct = inverted ? (1/(1+chg) - 1) * 100 : chg * 100;
  return {text, pct, inverted};
}

}

const dateLoc = () => lang === 'ru' ? 'ru' : 'en-US';
let chartReq = 0;
async function fetchAndDrawChart(code, days) {
  const req = ++chartReq;
  let labels=[], data=[];
  try {
    if(CRYPTO_SET.has(code)) {
      const pts = await cryptoHistory(code, days);
      const step=Math.max(1,Math.floor(pts.length/90));
      pts.filter((_,i)=>i%step===0 || i===pts.length-1).forEach(([ts,p])=>{ labels.push(ts); data.push(p); });
    } else {
      // Фиат — реальные дневные курсы. ~16 точек на любой период.
      const n = parseInt(days);
      const step = Math.max(1, Math.round(n / (n > 90 ? 26 : 16)));
      const latest = await fetchSnapshot('latest');
      const end = latest ? new Date(latest.date + 'T00:00:00Z') : new Date();
      const dates = [];
      for (let i = n; i > 0; i -= step) { const d = new Date(end); d.setUTCDate(d.getUTCDate() - i); dates.push(isoDate(d)); }
      const snaps = await Promise.all(dates.map(fetchSnapshot));
      snaps.push(latest); dates.push(isoDate(end));
      const key = code.toLowerCase();
      const r0 = rates[code] || latest?.usd?.[key] || 0;
      const inverted = r0 && r0 < 1;
      snaps.forEach((sn, i) => {
        const v = sn?.usd?.[key];
        if (!v) return;
        labels.push(new Date(dates[i] + 'T12:00:00Z').getTime());
        data.push(inverted ? 1 / v : v);
      });
    }
  } catch(e) {}
  if (req !== chartReq) return; // пользователь уже переключил период/валюту
  drawChart(labels, data);
}

// Вертикальная линия-перекрестие и точка под пальцем
// Пунктирная линия цены начала периода
const baseline = {
  id: 'baseline',
  beforeDatasetsDraw(chart) {
    const v = chart.data.datasets[0]?.data?.[0];
    if (v == null) return;
    const y = chart.scales.y.getPixelForValue(v), {left, right} = chart.chartArea, ctx = chart.ctx;
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke(); ctx.restore();
  }
};
const crosshair = {
  id: 'crosshair',
  afterDraw(chart) {
    const a = chart.tooltip?.getActiveElements?.() || [];
    if (!a.length) return;
    const {x, y} = a[0].element, {top, bottom} = chart.chartArea, ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.setLineDash([3,3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
    const ds = chart.data.datasets[0], css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    ctx.setLineDash([]); ctx.fillStyle = ds.data[a[0].index] >= ds.data[0] ? (css('--up')||'#34c759') : (css('--down')||'#ff453a');
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#000'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
};

function drawChart(labels, data) {
  if(chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const empty = document.getElementById('chart-empty');
  if (data.length < 2) {
    empty.style.display = 'flex';
    empty.textContent = T('Не удалось загрузить график. Попробуй позже.', "Couldn't load the chart. Try again later.");
    ['stat-min','stat-max','stat-chg'].forEach(id => document.getElementById(id).textContent = '—');
    document.getElementById('stat-chg-pill').textContent = '';
    return;
  }
  empty.style.display = 'none';
  const min=Math.min(...data), max=Math.max(...data);
  const first=data[0], last=data[data.length-1];
  const change=first?((last-first)/first*100):0;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const UP = css('--up')||'#34c759', DOWN = css('--down')||'#ff453a';
  const color = change>=0 ? UP : DOWN;
  document.getElementById('stat-min').textContent=fmtChartPrice(min);
  document.getElementById('stat-max').textContent=fmtChartPrice(max);
  const chgEl=document.getElementById('stat-chg');
  chgEl.textContent=(change>=0?'+':'')+change.toFixed(2)+'%';
  chgEl.style.color=change>=0?'var(--up)':'var(--down)';
  setChartHeader(last, null, first);
  const ctx=document.getElementById('rateChart').getContext('2d');
  const sub = css('--sub') || '#888';
  // Как на бирже (baseline): выше цены начала периода — зелёным, ниже — красным,
  // пунктир — цена начала. Раньше весь график красился в один цвет по итогу.
  const segColor = c => ((c.p0.parsed.y + c.p1.parsed.y) / 2 >= first ? UP : DOWN);
  chartInstance=new Chart(ctx,{
    type:'line',
    data:{ labels, datasets:[{ data, borderColor:color, borderWidth:2, pointRadius:0, pointHoverRadius:0, tension:0.25,
      segment:{ borderColor: segColor },
      fill:{ target:{ value:first }, above: UP+'2e', below: DOWN+'2e' } }] },
    options:{
      responsive:true, maintainAspectRatio:false, animation:{duration:350},
      interaction:{ mode:'index', intersect:false },
      events:['mousemove','mouseout','touchstart','touchmove','touchend'],
      plugins:{ legend:{display:false}, tooltip:{ enabled:false } },
      onHover:(e, els) => {
        if (els.length && e.type !== 'mouseout' && e.type !== 'touchend') {
          const i = els[0].index; setChartHeader(data[i], labels[i], first);
        } else setChartHeader(last, null, first);
      },
      layout:{ padding:{ left:6, right:0 } },
      scales:{
        x:{ display:true, grid:{ display:false }, border:{ display:false },
            ticks:{ color:sub, font:{size:10, family:'Inter'}, maxTicksLimit:4, maxRotation:0, autoSkipPadding:24,
                    callback:(v,i)=>chartDate(labels[i], false) } },
        y:{ position:'right', grid:{ color:'rgba(255,255,255,0.05)' }, border:{ display:false },
            ticks:{ color:sub, font:{size:10, family:'Inter'}, maxTicksLimit:5, padding:6, callback:v=>fmt(v) } }
      }
    },
    plugins:[crosshair, baseline]
  });
  // Сбросить заголовок, когда палец отпущен
  ctx.canvas.ontouchend = ctx.canvas.onmouseleave = () => { chartInstance?.tooltip?.setActiveElements([], {x:0,y:0}); chartInstance?.update('none'); setChartHeader(last, null, first); };
}

// «сегодня 14:05» / «вчера 09:12» / «12 нояб., 18:40» — как история в боте
function histWhen(h) {
  if (!h.ts) return h.time || '';
  const d = new Date(h.ts), now = new Date();
  const hm = d.toLocaleTimeString(dateLoc(), {hour:'2-digit', minute:'2-digit'});
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  if (diff === 0) return T('сегодня ','today ') + hm;
  if (diff === 1) return T('вчера ','yesterday ') + hm;
  return d.toLocaleDateString(dateLoc(), {day:'numeric', month:'short'}) + ', ' + hm;
}

// Старые записи хранили готовую строку «1,00 EUR» / «1.00 EUR» — переформатируем
function parseLooseNum(str) {
  let t = String(str).replace(/[^\d.,]/g, '');
  const lc = t.lastIndexOf(','), ld = t.lastIndexOf('.');
  const dec = Math.max(lc, ld);
  if (dec >= 0 && t.length - dec - 1 !== 3) t = t.slice(0, dec).replace(/[.,]/g, '') + '.' + t.slice(dec + 1);
  else t = t.replace(/[.,]/g, '');
  return parseFloat(t);
}
function legacyNum(str) {
  const code = (String(str).match(/[A-Z]{3,4}$/) || [''])[0];
  const v = parseLooseNum(String(str).replace(code, ''));
  return isFinite(v) ? fmt(v) + (code ? ' ' + code : '') : str;
}
function histAmount(h) { return h.a != null ? fmt(h.a) + ' ' + h.f : legacyNum(h.from); }
function saveHistory(fromCur, amount, toCur, result) {
  // Числа храним как есть и форматируем при показе — раньше строка
  // форматировалась на языке момента, и в истории было «1,00» и «1.00» вперемешку
  const entry = { f: fromCur, a: +amount, to: toCur, r: +result, ts: Date.now() };
  const last = lsHistory[0];
  if(last && last.f===entry.f && last.a===entry.a && last.to===entry.to && Math.abs(last.r-entry.r)<=Math.abs(entry.r)*1e-9) return;
  lsHistory = [entry,...lsHistory].slice(0,10);
  LS.set('lsk_hist', JSON.stringify(lsHistory));
}

// Wise comparison API отдаёт котировки Wise, Western Union, MoneyGram,

const TRANSFER_SEND_COUNTRY = 'DE';
const TRANSFER_PROVIDER_NAMES = {"xoom":"PayPal (Xoom)","moneygram":"MoneyGram","western-union":"Western Union","wise":"Wise"};
const MONO_ISO = {USD:840, EUR:978, GBP:826, PLN:985, CHF:756};

async function fetchWise(amount, from, to) {
  try {
    const u = `https://api.wise.com/v3/comparisons/?sourceCurrency=${from}&targetCurrency=${to}&sendAmount=${amount}`;
    const r = await fetch(u, {signal: AbortSignal.timeout(12000)});
    if (!r.ok) return [];
    const d = await r.json();
    const out = [];
    for (const p of d.providers || []) {
      const quotes = (p.quotes || []).filter(q => q.receivedAmount);
      if (!quotes.length) continue;
      const q = quotes.find(q => q.sourceCountry === TRANSFER_SEND_COUNTRY) || quotes.find(q => !q.sourceCountry) || quotes[0];
      out.push({ name: TRANSFER_PROVIDER_NAMES[p.alias] || p.name || p.alias || '?',
                 received: +q.receivedAmount, fee: +(q.fee || 0), rate: +(q.rate || 0), approx: false });
    }
    return out;
  } catch { return []; }
}

// to UAH: продаём валюту на счёте Mono (rateBuy).
// from UAH: покупаем валюту за гривну в Mono (rateSell) — международные
// сервисы из сравнения не принимают гривну для отправки, так что это
// единственная оценка для таких пар.
async function fetchMono(amount, from, to) {
  const toUah = to === 'UAH' && MONO_ISO[from];
  const fromUah = from === 'UAH' && MONO_ISO[to];
  if (!toUah && !fromUah) return null;
  try {
    if (!monoCache || Date.now() - monoCache.t > 300000) {
      const r = await fetch('https://api.monobank.ua/bank/currency', {signal: AbortSignal.timeout(8000)});
      if (r.ok) monoCache = {t: Date.now(), d: await r.json()};
    }
    const cur = toUah ? from : to;
    const row = (monoCache?.d || []).find(x => x.currencyCodeA === MONO_ISO[cur] && x.currencyCodeB === 980);
    if (toUah) {
      if (!row?.rateBuy) return null;
      return {name:'Monobank', received: amount * row.rateBuy, fee: 0, rate: row.rateBuy, approx: true, monoDir: 'sell'};
    }
    if (!row?.rateSell) return null;
    return {name:'Monobank', received: amount / row.rateSell, fee: 0, rate: 1 / row.rateSell, approx: true, monoDir: 'buy'};
  } catch { return null; }
}

// Сервер сравнения (Supabase Edge Function): Wise + USDT P2P (Binance) +
// Monobank. Binance P2P из браузера недоступен, поэтому P2P — только через
// сервер. Если сервер не ответил — считаем сами (Wise + Monobank).
const TRANSFER_API = 'https://daicafgagkvinbtqifbc.supabase.co/functions/v1/transfer-quotes';
async function fetchServerQuotes(amount, from, to) {
  try {
    const r = await fetch(`${TRANSFER_API}?from=${from}&to=${to}&amount=${amount}`, {signal: AbortSignal.timeout(15000)});
    if (!r.ok) return null;
    const d = await r.json();
    if (!Array.isArray(d.offers)) return null;
    return d.offers.map(o => ({...o, monoDir: o.kind === 'mono-buy' ? 'buy' : o.kind === 'mono-sell' ? 'sell' : undefined, p2p: o.kind === 'p2p'}));
  } catch { return null; }
}

async function runTransfer() {
  const amount = Math.min(parseFloat(document.getElementById('tr-amount').value) || 0, 1e7);
  const from = document.getElementById('tr-from').value, to = document.getElementById('tr-to').value;
  const box = document.getElementById('tr-result');
  if (amount <= 0) { box.innerHTML = `<div class="empty-state">${T('Введи сумму больше нуля','Enter an amount above zero')}</div>`; return; }
  if (from === to) { box.innerHTML = `<div class="empty-state">${T('Выбери разные валюты','Pick two different currencies')}</div>`; return; }
  haptic('light');
  const key = `${from}-${to}-${amount}`;
  const btn = document.getElementById('tr-btn');
  let res = trCache[key] && Date.now() - trCache[key].t < 120000 ? trCache[key] : null;
  if (!res) {
    btn.disabled = true;
    box.innerHTML = `<div class="loading"><div class="spinner"></div>${T('Сравниваю предложения...','Comparing offers...')}</div>`;
    let offers = await fetchServerQuotes(amount, from, to);
    if (!offers) {
      const [wise, mono] = await Promise.all([fetchWise(amount, from, to), fetchMono(amount, from, to)]);
      offers = [...wise, ...(mono ? [mono] : [])];
    }
    btn.disabled = false;
    res = {t: Date.now(), amount, from, to, offers: offers.sort((a,b)=>b.received-a.received)};
    if (res.offers.length) trCache[key] = res;
    track('app_transfer', from, to);
  }
  lastTransfer = res;
  renderTransfer(res);
}

const MAX_ALERTS = 5;

const pairRate = (f, t) => { const u = toUSD(f, 1); return u ? fromUSD(u, t) : 0; };

async function alertsApi(method, body, qs = '') {
  const r = await fetch(FN_BASE + 'miniapp-alerts' + qs, {
    method, headers: {'x-init-data': TG?.initData || '', 'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined, signal: AbortSignal.timeout(12000),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'http'); e.code = d.error || 'http'; throw e; }
  return d;
}
function alertErrText(code) {
  return ({
    limit: T(`Максимум ${MAX_ALERTS} уведомлений. Удали старое во вкладке «Сохранено».`, `Maximum ${MAX_ALERTS} alerts. Delete an old one in the Saved tab.`),

    too_close: T('Цель почти равна текущему курсу, выбери другую.', 'Target is almost the current rate, pick another one.'),

  })[code] || T('Сервис недоступен, попробуй чуть позже.', 'Service unavailable, try again in a bit.');

async function loadAlerts() {
  if (!TG?.initData) { alertsState = 'notg'; renderAlerts(); return; }
  if (alertsState === 'loading') return;
  alertsState = myAlerts ? 'ready' : 'loading';
  renderAlerts();

}
function renderAlerts() {
  const el = document.getElementById('alerts-section');
  if (!el) return;
  let body;
  if (alertsState === 'notg') body = `<div class="al-empty">${T('Уведомления работают в Telegram: открой мини-апп из бота.', 'Alerts work inside Telegram: open the mini app from the bot.')}</div>`;

  else if (!myAlerts?.length) body = `<div class="al-empty">${T('Пока нет. Бот пришлёт сообщение, когда курс дойдёт до твоей цели.', "None yet. The bot will message you when the rate hits your target.")}</div>`;
  else body = myAlerts.map(a => {
    const up = a.direction === 'above', now = pairRate(a.from_cur, a.to_cur);

async function deleteAlert(id) {
  haptic('light');

  myAlerts = (myAlerts || []).filter(a => a.id !== id); renderAlerts();
  try { myAlerts = (await alertsApi('DELETE', null, '?id=' + id)).alerts || myAlerts; }
  catch { myAlerts = prev; }
  renderAlerts();
}

  document.getElementById('al-to').innerHTML = html;

function openAlert(f, t) {

  // «1 ₴ = 0.02 €» неудобно — ставим как «1 € = 49 ₴»

  document.getElementById('al-from').value = f;
  document.getElementById('al-to').value = t;

function setAlertPct(p) {
  const f = document.getElementById('al-from').value, t = document.getElementById('al-to').value;

async function saveAlert() {
  const f = document.getElementById('al-from').value, t = document.getElementById('al-to').value;

// ===== НОВОСТИ РЫНКА =====
// Заголовки из открытых RSS на языке интерфейса (функция market-news)
const newsCache = {};
let newsLoadingLang = null;
const escHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
function timeAgo(ts) {
  const m = Math.max(1, Math.round((Date.now() - ts) / 60000));
  if (m < 60) return T(`${m} мин назад`, `${m} min ago`);
  const h = Math.round(m / 60);
  if (h < 24) return T(`${h} ч назад`, `${h} h ago`);
  const d = Math.round(h / 24);
  return T(`${d} дн. назад`, `${d} d ago`);
}
async function loadNews(force) {
  const l = lang, c = newsCache[l];
  if (c && !force && Date.now() - c.t < 5 * 60000) return renderNews();
  if (newsLoadingLang === l) return;
  newsLoadingLang = l;
  if (!c) renderNews();
  try {
    const r = await fetch(`${FN_BASE}market-news?lang=${l}`, {signal: AbortSignal.timeout(15000)});
    const d = await r.json();
    if (!r.ok || !Array.isArray(d.items)) throw new Error('bad');
    newsCache[l] = {t: Date.now(), items: d.items};
  } catch { if (!newsCache[l]) newsCache[l] = {t: 0, items: null}; }
  newsLoadingLang = null;
  if (lang === l) renderNews();
}
function renderNews() {
  const el = document.getElementById('news-list'), foot = document.getElementById('news-foot');
  const c = newsCache[lang];
  foot.textContent = '';
  if (!c) { el.innerHTML = `<div class="loading"><div class="spinner"></div>${T('Загрузка...', 'Loading...')}</div>`; return; }
  if (!c.items) { el.innerHTML = `<div class="empty-state">${T('Новости сейчас недоступны.', 'News is unavailable right now.')}<br><button class="al-add" style="max-width:220px;margin:12px auto 0" onclick="loadNews(true)">${T('Повторить', 'Retry')}</button></div>`; return; }
  if (!c.items.length) { el.innerHTML = `<div class="empty-state">${T('Свежих новостей пока нет.', 'No fresh news yet.')}</div>`; return; }
  el.innerHTML = '<div class="list">' + c.items.map((n, i) => `<div class="news-item" onclick="openNews(${i})">
      <div class="news-body"><div class="news-title">${escHtml(n.title)}</div>
      <div class="news-meta"><span class="news-src">${escHtml(n.source)}</span><span>·</span><span>${timeAgo(n.ts)}</span></div></div>
      ${n.image ? `<img class="news-img" src="${escHtml(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
    </div>`).join('') + '</div>';
  foot.textContent = T('Заголовки и ссылки на источники. Не инвестиционный совет.', 'Headlines link to the original sources. Not investment advice.');
}
function openNews(i) {
  const n = newsCache[lang]?.items?.[i];
  if (!n || !/^https:\/\//.test(n.link)) return;
  haptic('light');
  if (TG?.openLink) TG.openLink(n.link); else window.open(n.link, '_blank', 'noopener');
}

function applyStartParams() {
  const q = new URLSearchParams(location.search);
  let from = q.get('from'), to = q.get('to'), amount = q.get('amount');
  const sp = TG?.initDataUnsafe?.start_param || q.get('tgWebAppStartParam');
  if (sp) { const [a,b,c] = sp.split('_'); from = from || a; to = to || b; amount = amount || c; }
  const has = (id, v) => v && [...document.getElementById(id).options].some(o => o.value === v.toUpperCase());
  if (has('from-cur', from)) document.getElementById('from-cur').value = from.toUpperCase();
  if (has('to-cur', to)) document.getElementById('to-cur').value = to.toUpperCase();
  if (amount && parseFloat(amount) > 0) document.getElementById('amount').value = parseFloat(amount);
}

applyStartParams();
applyLang();
document.getElementById('tr-amount').addEventListener('keydown', e => { if (e.key === 'Enter') runTransfer(); });
loadFiat(); loadCrypto(); loadMetals(); loadDailyChanges();
setInterval(loadFiat,60000); setInterval(loadCrypto,60000); setInterval(loadDailyChanges, 3600000);
</script>
